                type: string
                example: Sun, 15 Feb 2026 12:03:40 GMT
            Connection:
              schema:
                type: string
                example: keep-alive
            Keep-Alive:
              schema:
                type: string
                example: timeout=5
          content:
            text/plain:
              schema:
                type: string
              example: |-
                {
                    "msg": "User created successfully!"
                }
