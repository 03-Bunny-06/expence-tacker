components:
  securitySchemes:
    UserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        🔐 **User Authorization**

        - Use an **User JWT token.**
        - Paste the token in the **Authorize** button.
        - _Note: Do not attach the Bearer in this only use the (raw token)_
        - Format must be exactly only the _(raw token)_:
        `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImpvaG4uZG9lQGV4YW1wbGUuY29tIiwiaWF0IjoxNzcxMTc2MTY4fQ.xT3tFGaGt32n-gVDzopFssqJFSg2_5lSeitSVB6bD0k`