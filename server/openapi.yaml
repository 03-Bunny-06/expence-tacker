openapi: 3.0.0
info:
  title: Expense Tracker API Documentation
  version: 1.0.0
  description: | 
      A robust backend service designed to power an expense tracking application. It offers secure user authentication, comprehensive transaction management, and powerful API features like filtering and pagination.

      🚀 **Key Features**: 
        - **Secure Authentication:** User registration and login with password and JWT-based auth tokens.
        - **Query Filters & Search:** Fetch transactions with optional filters (e.g., by date, category) and text search capabilities.
        - **Transaction CRUD Operations:** Full Create, Read, Update, Delete operations for user expense/transaction records.
        - **Pagination:** Efficient pagination support to load large transaction lists in pages (page & limit query params).
      
      🛠 **Tech Stack**: 
        - **Node.js:** JavaScript runtime for server-side logic. 
        - **Express.js:** Lightweight REST API framework handling routing and HTTP requests.
        - **MongoDB & Mongoose:** NoSQL database and ODM for storage and schema modeling.
        - **JWT & Swagger (OpenAPI):** JSON Web Tokens for secure sessions and Swagger for API documentation.
  contact: 
    name: Sai Kowshik 
    email: saikowshik0306@gmail.com 
    url: https://github.com/03-Bunny-06/expence-tacker.git
servers:
  - url: https://api-expence-tacker.onrender.com
tags:
  - name: Users
  - name: Transactions
  - name: Non-Existing Routes
security: 
  - UserAuth: []
